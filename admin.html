<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Site Editor | Rhenante Travel & Tours</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; }
    .admin [hidden] { display: none !important; }
    .admin fieldset { border: 1px solid #cbd9e2; border-radius: 12px; padding: 1rem; margin: 0 0 1rem; display: grid; gap: .75rem; }
    .admin legend { font-weight: 700; color: var(--ocean); padding: 0 .4rem; text-transform: capitalize; }
    .admin .thumb { width: 180px; border-radius: 10px; }
    .admin .bar { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1rem 0; }
    .admin .bar .btn, .admin fieldset > .btn { margin-top: .25rem; }
  </style>
</head>
<body>
<section class="admin">
  <h1>Site Editor</h1>
  <p class="note">Only the owner can save changes. Keep this page link private.</p>

  <fieldset id="login">
    <legend>Connect to GitHub</legend>
    <label>Access token <input id="token" type="password" autocomplete="off" placeholder="github_pat_..."></label>
    <button class="btn btn-primary" id="connect">Connect</button>
    <p class="note" id="login-msg"></p>
  </fieldset>

  <div id="editor" hidden>
    <div id="fields"></div>
    <div class="bar">
      <button class="btn btn-primary" id="save">Save changes to website</button>
      <button class="btn btn-ghost" id="logout">Disconnect</button>
    </div>
    <p class="note" id="status"></p>
  </div>
</section>
